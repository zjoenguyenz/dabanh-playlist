name: Mirror dabanh playlist

# Keeps tttt.m3u in this repo synced with the primary source.
# If the primary source dies, the last good copy stays served from
# this repo's raw URL. A fetch is only accepted when it looks like a
# real playlist (>= 50 entries), so an error page can never overwrite
# the last good copy.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch latest playlist from primary source
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 "https://thtt.pages.dev/tttt.m3u" -o tttt.new.m3u
          head -n 1 tttt.new.m3u | grep -q "#EXTM3U"
          COUNT="$(grep -c '#EXTINF' tttt.new.m3u || true)"
          echo "Playlist entries: ${COUNT}"
          test "${COUNT}" -ge 50
          mv tttt.new.m3u tttt.m3u

      - name: Commit if changed
        run: |
          if git diff --quiet -- tttt.m3u; then
            echo "Playlist unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tttt.m3u
          git commit -m "Mirror update $(date -u +%FT%TZ)"
          git push
